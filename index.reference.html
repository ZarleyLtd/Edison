<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#e39b12" />
  <meta name="description" content="Edison logs tickets and sends them to a coding agent after you approve." />
  <title>Edison</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/brief-message.css" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; connect-src 'self' https://api.github.com; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'" />
</head>
<body data-page="list">
  <header class="top">
    <a class="brand" href="index.html">
      <svg class="brand-bulb" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3a8 8 0 0 0-4.6 14.5c.4.4.6.9.6 1.4V21a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.1c0-.5.2-1 .6-1.4A8 8 0 0 0 16 3zm-2.2 20.2h4.4V25a2.2 2.2 0 0 1-4.4 0v-1.8z"/></svg>
      <span>Edison</span>
    </a>
    <nav aria-label="Primary">
      <a href="index.html">Tickets</a>
      <a href="settings.html">Settings</a>
    </nav>
  </header>
  <div class="layout two-pane">
    <section class="list-pane" aria-label="Tickets">
      <div class="toolbar">
        <h1>Tickets</h1>
        <button type="button" class="primary" id="new-ticket">New ticket</button>
      </div>
      <p id="error" class="banner" hidden></p>
      <form id="filters" class="filters" aria-label="Filter tickets">
        <label class="field">Search<input id="filter-text" type="search" placeholder="Words in the ticket" /></label>
        <label class="field">App
          <select id="filter-app"><option value="">All apps</option></select>
        </label>
        <label class="field">Type
          <select id="filter-type">
            <option value="">Any type</option>
            <option value="bug">Bug</option>
            <option value="change">Change</option>
            <option value="feature">Feature</option>
            <option value="idea">Idea</option>
          </select>
        </label>
        <label class="field">Stage
          <select id="filter-stage">
            <option value="">Any stage</option>
            <option value="inbox">Inbox</option>
            <option value="ready">Ready</option>
            <option value="working">Working</option>
            <option value="needs-input">Needs you</option>
            <option value="review">In review</option>
            <option value="parked">Parked</option>
          </select>
        </label>
        <label class="field">Priority
          <select id="filter-priority">
            <option value="">Any priority</option>
            <option value="p1">p1</option>
            <option value="p2">p2</option>
            <option value="p3">p3</option>
          </select>
        </label>
        <div class="state-toggles" role="group" aria-label="Open or done">
          <button type="button" class="toggle" id="filter-open" aria-pressed="true">Open</button>
          <button type="button" class="toggle" id="filter-done" aria-pressed="false">Done</button>
        </div>
      </form>
      <div id="list"></div>
    </section>
    <section class="detail-pane" id="detail" aria-label="Selected ticket">
      <div class="empty">
        <p class="muted">Select a ticket to read it here. On a phone it opens on its own page.</p>
      </div>
    </section>
  </div>
  <div id="sheet" class="sheet-backdrop" hidden>
    <form id="new-form" class="sheet stack" aria-labelledby="sheet-title">
      <h2 id="sheet-title">New ticket</h2>
      <label class="field">Title<input id="title" name="title" required maxlength="120" /></label>
      <label class="field">App
        <select id="app" name="app" required>
          <option value="">Choose an app</option>
        </select>
      </label>
      <label class="field">Type
        <select id="type" name="type">
          <option value="bug">Bug</option>
          <option value="change">Change</option>
          <option value="feature">Feature</option>
          <option value="idea">Idea</option>
        </select>
      </label>
      <label class="field">Priority
        <select id="priority" name="priority">
          <option value="p1">p1</option>
          <option value="p2" selected>p2</option>
          <option value="p3">p3</option>
        </select>
      </label>
      <label class="field">Notes<textarea id="notes" name="notes" placeholder="What did you notice?"></textarea></label>
      <div class="row">
        <label class="field">Link<input id="url" type="url" inputmode="url" placeholder="https://" /></label>
        <button type="button" id="add-url">Add link</button>
      </div>
      <ul id="urls" class="chips"></ul>
      <label class="field">Photos<input id="photos" type="file" accept="image/*" capture="environment" multiple /></label>
      <div id="file-progress" class="file-progress" hidden>
        <div class="file-progress__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Filing the ticket">
          <div class="file-progress__bar"></div>
        </div>
        <p id="file-progress-label" class="hint">Filing the ticket…</p>
      </div>
      <div class="row">
        <button type="submit" class="primary" id="save-ticket">File ticket</button>
        <button type="button" id="sheet-cancel">Cancel</button>
      </div>
    </form>
  </div>
  <footer class="site-footer">Tickets for the ZarleyLtd apps.</footer>
  <script src="assets/js/config/app-config.js"></script>
  <script src="assets/js/utils/auth.js"></script>
  <script src="assets/js/utils/labels.js"></script>
  <script src="assets/js/utils/query.js"></script>
  <script src="assets/js/utils/formatters.js"></script>
  <script src="assets/js/utils/api.js"></script>
  <script src="assets/js/utils/image-compress.js"></script>
  <script src="assets/js/utils/brief-message.js"></script>
  <script src="assets/js/utils/apps.js"></script>
  <script src="assets/js/utils/agents.js"></script>
  <script src="assets/js/utils/setup.js"></script>
  <script src="assets/js/components/ticket-card.js"></script>
  <script src="assets/js/components/ticket-view.js"></script>
  <script src="assets/js/pages/list.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
