# edison-claude-workflow v3
# Edison starts Claude by commenting @claude: Deploy Agent comments on the
# issue, and later notes are sent as a comment on the ticket's pull request.
# Edison adds this file to an app as .github/workflows/claude.yml through
# Settings -> Agent setup. The app also needs a CLAUDE_CODE_OAUTH_TOKEN
# repository secret (see tools/set-claude-secret.ps1 in the Edison repo).
# The first line is the marker Edison checks; bump it when this file changes.
name: Claude Code (Edison)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only Edison's own comments, and only from people with write access.
    if: >-
      startsWith(github.event.comment.body, '@claude') &&
      contains(github.event.comment.body, 'Edison ticket:') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Rebuild the owner's C:\CursorSites layout around this checkout, so
      # Claude reads the same shared rules and skills as a local session:
      # ../cursor-sites-shared (specs, UI code, skills), ../CLAUDE.md (the
      # shared rules), and the reference apps that the skills point at.
      - name: Add shared CursorSites conventions
        run: |
          set -euo pipefail
          root="$(dirname "$GITHUB_WORKSPACE")"
          git clone --quiet --depth 1 https://github.com/ZarleyLtd/cursor-sites-shared.git "$root/cursor-sites-shared"
          cp "$root/cursor-sites-shared/CLAUDE.md" "$root/CLAUDE.md"
          skills="${CLAUDE_CONFIG_DIR:-$HOME/.claude}/skills"
          mkdir -p "$skills"
          cp -R "$root/cursor-sites-shared/skills/." "$skills/"
          clone_ref() {
            if [ "$GITHUB_REPOSITORY" = "ZarleyLtd/$1" ] || [ -e "$root/$2" ]; then return 0; fi
            git clone --quiet --depth 1 "https://github.com/ZarleyLtd/$1.git" "$root/$2" \
              || echo "::warning::Could not clone reference app $1"
          }
          clone_ref FamilyTree FamilyTree
          clone_ref ierne-snooker ierne-snooker
          clone_ref Edison Edison
          clone_ref CrossGunsSnooker PubliiCrossguns

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            COMMENTED ON: #${{ github.event.issue.number }} (${{ github.event.issue.pull_request && 'a pull request' || 'an issue' }})

            You are working an Edison ticket. Edison is the owner's ticket
            tracker. Follow the repository's CLAUDE.md. The comment that
            started this run is between the markers; the Edison issue number
            is on its "Issue: #" line.

            This repository sits in a CursorSites folder like the owner's
            C:\CursorSites. ../CLAUDE.md holds the shared rules for every
            app; read it before you start. ../cursor-sites-shared/ holds the
            pattern specs, synced UI code and skills (also installed as
            skills), and ../FamilyTree, ../ierne-snooker, ../Edison and
            ../PubliiCrossguns are reference apps. When the ticket names a
            shared pattern, use its skill. Everything outside this
            repository is read-only: change and commit only this
            repository, and if the ticket needs a change to shared code,
            say so in your summary.

            ----- comment -----
            ${{ github.event.comment.body }}
            ----- end comment -----

            How to work it:
            1. Read the Edison issue and all its comments with
               `gh issue view <issue> --comments`. Open linked screenshots or
               attachments when they matter.
            2. If the comment was on a pull request, or an open pull request
               for the issue already exists
               (`gh pr list --state open --search "<issue> in:body"`), check
               out that pull request's branch with `gh pr checkout`, continue
               from its commits, and act on every note in the comment, oldest
               first. Do not open another pull request.
            3. Otherwise create a branch named `edison/issue-<issue>`, make the
               change, push it, and open a pull request with `gh pr create`
               whose body contains `Fixes #<issue>`.
            4. Never merge, close, or force-push.
            5. Comment a short summary of what changed and how to review it
               on the issue with `gh issue comment <issue>`.
            6. When this round is on the pull request, run
               `gh issue edit <issue> --add-label stage:review --remove-label stage:working`,
               including when no code change was needed.
            7. If you are blocked or need a decision, comment the question on
               the issue and run
               `gh issue edit <issue> --add-label stage:needs-input --remove-label stage:working`.
          claude_args: |
            --add-dir ${{ github.workspace }}/..
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,Skill,Bash(git:*),Bash(gh issue:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr checkout:*),Bash(gh pr comment:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh issue close:*),Bash(git push --force:*),Bash(git push -f:*)"
